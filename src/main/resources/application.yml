spring:
  application:
    name: medicare

  jackson:
    deserialization:
      accept-float-as-int: false

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/medicare}

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
